<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280">
  <defs>
    <style>
      .bg{fill:#171d1b}.screen{fill:#293431;stroke:#6d7771;stroke-width:3}.safe{fill:none;stroke:#85928c;stroke-width:2;stroke-dasharray:10 9}.focus{fill:#e7ac7b;stroke:#ffe0b9;stroke-width:4}.opp{fill:#b7685c;stroke:#ef9a84;stroke-width:4}.dog{fill:#c37843;stroke:#f1bf83;stroke-width:4}.oppdog{fill:#696a65;stroke:#a7aaa2;stroke-width:3}.leash{fill:none;stroke:#47ae91;stroke-width:9;stroke-linecap:round}.axis{fill:none;stroke:#e6785f;stroke-width:3;stroke-dasharray:12 8}.title{font:700 30px sans-serif;fill:#f5ead5}.label{font:700 20px sans-serif;fill:#f5ead5}.note{font:17px sans-serif;fill:#bbbcb4}.amber{fill:#f2b84b}.zone{fill:#e7ac7b;fill-opacity:.08;stroke:#e7ac7b;stroke-opacity:.5;stroke-width:2}</style>
  </defs>
  <rect width="1440" height="1280" class="bg"/>
  <text x="52" y="60" class="title">D4-11 · COMBAT FOCUS COMPOSITION</text>
  <text x="52" y="94" class="note">Camera follows dog · composition focuses owner · orbit may reverse without breaking the relationship read</text>

  <g transform="translate(70 150)">
    <text x="0" y="0" class="title">DOG ORBITS LEFT</text>
    <rect x="0" y="34" width="570" height="760" rx="30" class="screen"/>
    <rect x="32" y="108" width="506" height="522" class="safe"/>
    <rect x="190" y="230" width="260" height="300" rx="95" class="zone"/>
    <path d="M274 400 L410 375" class="axis"/>
    <ellipse cx="280" cy="402" rx="53" ry="112" class="focus"/>
    <circle cx="280" cy="278" r="45" class="focus"/>
    <ellipse cx="414" cy="375" rx="51" ry="108" class="opp"/>
    <circle cx="414" cy="255" r="43" class="opp"/>
    <ellipse cx="150" cy="625" rx="67" ry="91" class="dog"/>
    <circle cx="163" cy="545" r="44" class="dog"/>
    <path d="M164 565 Q190 478 246 423" class="leash"/>
    <ellipse cx="495" cy="500" rx="42" ry="54" class="oppdog"/>
    <circle cx="488" cy="450" r="29" class="oppdog"/>
    <circle cx="164" cy="522" r="8" class="amber"/>
    <text x="70" y="728" class="label">PLAYER DOG</text>
    <text x="224" y="202" class="label">OWNER FOCUS</text>
    <text x="390" y="184" class="label">OPPONENT</text>
    <text x="0" y="835" class="note">Open space remains on the dog's left.</text>
    <text x="0" y="863" class="note">Leash travels inward without crossing faces.</text>
  </g>

  <g transform="translate(800 150)">
    <text x="0" y="0" class="title">DOG ORBITS RIGHT</text>
    <rect x="0" y="34" width="570" height="760" rx="30" class="screen"/>
    <rect x="32" y="108" width="506" height="522" class="safe"/>
    <rect x="120" y="230" width="260" height="300" rx="95" class="zone"/>
    <path d="M296 400 L160 375" class="axis"/>
    <ellipse cx="290" cy="402" rx="53" ry="112" class="focus"/>
    <circle cx="290" cy="278" r="45" class="focus"/>
    <ellipse cx="156" cy="375" rx="51" ry="108" class="opp"/>
    <circle cx="156" cy="255" r="43" class="opp"/>
    <ellipse cx="420" cy="625" rx="67" ry="91" class="dog"/>
    <circle cx="407" cy="545" r="44" class="dog"/>
    <path d="M406 565 Q380 478 324 423" class="leash"/>
    <ellipse cx="75" cy="500" rx="42" ry="54" class="oppdog"/>
    <circle cx="82" cy="450" r="29" class="oppdog"/>
    <circle cx="406" cy="522" r="8" class="amber"/>
    <text x="370" y="728" class="label">PLAYER DOG</text>
    <text x="236" y="202" class="label">OWNER FOCUS</text>
    <text x="60" y="184" class="label">OPPONENT</text>
    <text x="0" y="835" class="note">Screen hierarchy mirrors; character poses do not.</text>
    <text x="0" y="863" class="note">Soft dead-zone prevents rapid camera reversal.</text>
  </g>

  <g transform="translate(52 1070)">
    <text x="0" y="0" class="label">READ ORDER</text>
    <text x="0" y="36" class="note">1 Owner condition + contact   2 Player dog intent   3 Teal leash relationship   4 Opponent threat   5 Opponent dog reaction</text>
    <text x="0" y="68" class="note">Never: rigid lock-on · combat-start card · arena boundary · cropped feet · leash through faces · dog lost behind the opponent</text>
  </g>
</svg>
